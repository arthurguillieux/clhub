name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A handful of tests are integration tests proving the exclusion
    # constraint actually holds in Postgres — see
    # src/modules/pretotheque/data/*.integration.test.ts. Pure unit tests
    # don't need this service at all, but there's no clean way to split the
    # `pnpm test` run in Vitest without a second config, so it's simplest to
    # just always have a database available for the whole test job.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clhub
          POSTGRES_PASSWORD: clhub
          POSTGRES_DB: clhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clhub -d clhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clhub:clhub@localhost:5432/clhub
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test

  # Publishes ghcr.io/arthurguillieux/clhub — the Synology NAS only ever pulls
  # this image, it never builds it (a `next build` needs more RAM than the
  # NAS can spare; see ADR-010 in docs/02-architecture.md).
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
